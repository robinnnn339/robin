<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>崩坏：星穹铁道 — 角色群星录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans','Noto Serif SC',system-ui,sans-serif;
  background:#07080f;
  color:#e8e6f0;
  overflow-x:hidden;
  min-height:100vh;
}

/* ===== CUSTOM SCROLLBAR ===== */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:#0d0f1a}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#6b5ce7,#3b2d8a);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#7b6cf7}

/* ===== STARFIELD CANVAS ===== */
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ===== HEADER ===== */
header{
  position:relative;z-index:10;
  padding:4rem 2rem 2rem;
  text-align:center;
}
header::after{
  content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:60%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(107,92,231,0.6),transparent);
}
.subtitle{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:400;font-size:clamp(0.8rem,1.5vw,1rem);
  letter-spacing:0.6em;text-transform:uppercase;
  background:linear-gradient(135deg,#8b7cf7,#c4a8ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;margin-bottom:0.5rem;
}
h1{
  font-family:'Noto Serif SC',serif;
  font-weight:900;
  font-size:clamp(1.8rem,5vw,3.8rem);
  letter-spacing:0.08em;
  background:linear-gradient(135deg,#e8e6f0 0%,#b8a8f0 40%,#6b5ce7 70%,#c4a8ff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1.2;
}
h1 span{display:inline-block}
.quote{
  margin-top:1.2rem;
  font-family:'Noto Serif SC',serif;
  font-size:clamp(0.85rem,1.2vw,1.05rem);
  color:rgba(200,190,240,0.5);
  font-weight:400;
  letter-spacing:0.3em;
  font-style:italic;
}
.quote::before,.quote::after{content:'"'}
.quote::before{margin-right:0.15em}
.quote::after{margin-left:0.15em}

/* ===== SEARCH & FILTER ===== */
.controls{
  position:relative;z-index:10;
  display:flex;flex-wrap:wrap;gap:1rem;
  justify-content:center;align-items:center;
  padding:2rem 2rem 1.5rem;
  max-width:900px;margin:0 auto;
}
.search-wrap{
  position:relative;flex:1;min-width:200px;max-width:400px;
}
.search-wrap svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;opacity:0.4;
}
#search{
  width:100%;
  padding:0.75rem 1rem 0.75rem 2.6rem;
  border:1px solid rgba(107,92,231,0.25);
  border-radius:100px;
  background:rgba(13,15,26,0.8);
  backdrop-filter:blur(12px);
  color:#e8e6f0;
  font-size:0.9rem;
  font-family:'DM Sans',sans-serif;
  transition:border-color 0.3s,box-shadow 0.3s;
  outline:none;
}
#search::placeholder{color:rgba(200,190,240,0.3)}
#search:focus{
  border-color:rgba(107,92,231,0.6);
  box-shadow:0 0 0 3px rgba(107,92,231,0.12),0 0 30px rgba(107,92,231,0.08);
}

.filter-group{
  display:flex;gap:0.4rem;flex-wrap:wrap;justify-content:center;
}
.filter-btn{
  padding:0.5rem 1rem;
  border:1px solid rgba(107,92,231,0.2);
  border-radius:100px;
  background:rgba(13,15,26,0.6);
  backdrop-filter:blur(8px);
  color:rgba(200,190,240,0.6);
  font-size:0.78rem;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500;
  cursor:pointer;transition:all 0.3s;
  letter-spacing:0.04em;
}
.filter-btn:hover{color:#e8e6f0;border-color:rgba(107,92,231,0.5);background:rgba(107,92,231,0.12)}
.filter-btn.active{color:#fff;border-color:#6b5ce7;background:rgba(107,92,231,0.2);box-shadow:0 0 20px rgba(107,92,231,0.15)}

/* ===== GRID ===== */
.grid-wrap{
  position:relative;z-index:10;
  max-width:1320px;margin:0 auto;padding:1.5rem 2rem 4rem;
}
.char-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:1.2rem;
}
@media(max-width:600px){
  .char-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0.8rem}
  .controls{padding:1.5rem 1rem 1rem}
  .grid-wrap{padding:1rem 1rem 3rem}
}

/* ===== CHARACTER CARD ===== */
.char-card{
  position:relative;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  background:linear-gradient(160deg,rgba(20,18,40,0.7),rgba(13,15,26,0.9));
  border:1px solid rgba(107,92,231,0.12);
  transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1),
              box-shadow 0.4s ease,
              border-color 0.3s ease;
  aspect-ratio:3/4;
  display:flex;flex-direction:column;
}
.char-card:hover{
  transform:translateY(-6px) scale(1.02);
  border-color:rgba(107,92,231,0.35);
  box-shadow:0 12px 48px rgba(0,0,0,0.5),0 0 30px rgba(107,92,231,0.08);
}
.char-card:active{transform:translateY(-2px) scale(0.98)}

/* Rarity indicator */
.char-card .rarity{
  position:absolute;top:0;left:0;right:0;
  height:3px;
  z-index:2;
}
.rarity-5{background:linear-gradient(90deg,#f0c040,#ffd700,#f0c040)}
.rarity-4{background:linear-gradient(90deg,#8b5cf6,#a78bfa,#8b5cf6)}

.char-card .avatar{
  flex:1;
  display:flex;align-items:center;justify-content:center;
  padding:1rem;
  position:relative;
  overflow:hidden;
}
.char-card .avatar::before{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 100%,rgba(107,92,231,0.08),transparent 70%);
}
.char-card .avatar-inner{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(2.5rem,6vw,4rem);
  line-height:1;
  position:relative;
}
.char-card .avatar-inner .char-img{
  width:100%;height:100%;
  object-fit:contain;
  object-position:center 55%;
  filter:drop-shadow(0 4px 20px rgba(107,92,231,0.25));
  transition:transform 0.4s ease;
  pointer-events:none;
}
.char-card:hover .avatar-inner .char-img{transform:scale(1.06)}

.char-card .info{
  padding:0.8rem 1rem 1rem;
  background:linear-gradient(0deg,rgba(0,0,0,0.4),transparent);
  position:relative;
}
.char-card .name{
  font-family:'Noto Serif SC',serif;
  font-weight:700;
  font-size:clamp(0.95rem,1.4vw,1.1rem);
  color:#e8e6f0;
  display:flex;align-items:center;gap:0.4rem;
}
.char-card .name .star-icon{
  font-size:0.65em;
  background:linear-gradient(135deg,#f0c040,#ffd700);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.char-card .tags{
  display:flex;gap:0.4rem;margin-top:0.35rem;flex-wrap:wrap;
}
.char-card .tag{
  font-size:0.65rem;
  padding:0.15rem 0.5rem;
  border-radius:100px;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:500;
  letter-spacing:0.03em;
  opacity:0.7;
}
.tag-fire{background:rgba(255,107,53,0.2);color:#ff6b35}
.tag-ice{background:rgba(71,178,228,0.2);color:#47b2e4}
.tag-wind{background:rgba(0,204,153,0.2);color:#00cc99}
.tag-lightning{background:rgba(162,89,255,0.2);color:#a259ff}
.tag-quantum{background:rgba(30,144,255,0.2);color:#1e90ff}
.tag-imaginary{background:rgba(255,215,0,0.2);color:#ffd700}
.tag-physical{background:rgba(200,200,200,0.2);color:#c8c8c8}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(7,8,15,0.85);
  backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity 0.5s ease;
  padding:2rem;
}
.modal-overlay.open{opacity:1;pointer-events:auto}

.modal{
  position:relative;
  width:100%;max-width:820px;
  max-height:90vh;
  overflow-y:auto;
  border-radius:24px;
  background:linear-gradient(160deg,rgba(20,18,40,0.95),rgba(13,15,26,0.98));
  border:1px solid rgba(107,92,231,0.2);
  box-shadow:0 24px 80px rgba(0,0,0,0.6),0 0 60px rgba(107,92,231,0.06);
  transform:scale(0.92) translateY(20px);
  transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
  padding:0;
}
.modal-overlay.open .modal{transform:scale(1) translateY(0)}

.modal-close{
  position:sticky;top:1rem;float:right;margin:1rem;
  width:36px;height:36px;
  border-radius:50%;
  border:1px solid rgba(107,92,231,0.3);
  background:rgba(13,15,26,0.8);
  backdrop-filter:blur(8px);
  color:#e8e6f0;
  font-size:1.2rem;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.3s;
  z-index:2;
}
.modal-close:hover{background:rgba(107,92,231,0.25);border-color:#6b5ce7;transform:rotate(90deg)}

.modal-header{
  padding:2rem 2.5rem 1rem;
  position:relative;
}
.modal-rarity{
  font-size:0.8rem;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:600;
  letter-spacing:0.08em;
  text-transform:uppercase;
}
.modal-rarity.gold{color:#f0c040}
.modal-rarity.purple{color:#a78bfa}
.modal-title{
  display:flex;align-items:baseline;gap:0.8rem;
  margin-top:0.5rem;
}
.modal-title h2{
  font-family:'Noto Serif SC',serif;
  font-weight:900;
  font-size:clamp(1.6rem,3vw,2.4rem);
  color:#e8e6f0;
  letter-spacing:0.04em;
}
.modal-title .alt-name{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:1rem;font-weight:400;
  color:rgba(200,190,240,0.4);
}
.modal-title-row{
  display:flex;align-items:center;gap:1.5rem;
  margin-top:1rem;
}
.modal-portrait{
  flex-shrink:0;
  width:clamp(80px,12vw,140px);
  height:clamp(80px,12vw,140px);
  border-radius:16px;
  overflow:hidden;
  background:linear-gradient(135deg,rgba(107,92,231,0.1),rgba(59,45,138,0.05));
  border:1px solid rgba(107,92,231,0.12);
  display:flex;align-items:center;justify-content:center;
}
.modal-portrait .modal-img{
  width:100%;height:100%;
  object-fit:contain;
  object-position:center 60%;
}
.modal-title-info{flex:1;min-width:0}
.modal-meta{
  display:flex;flex-wrap:wrap;gap:0.6rem;
  margin-top:0.8rem;
}
.modal-meta .tag{font-size:0.75rem;padding:0.2rem 0.7rem;opacity:0.8}

.modal-body{padding:0 2.5rem 2.5rem;}

.modal-story{
  position:relative;
  padding:1.5rem 1.8rem;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(107,92,231,0.06),rgba(59,45,138,0.04));
  border:1px solid rgba(107,92,231,0.1);
  margin-bottom:1.5rem;
}
.modal-story h3{
  font-family:'Noto Serif SC',serif;
  font-weight:700;
  font-size:1.05rem;
  color:#c4a8ff;
  margin-bottom:0.8rem;
  letter-spacing:0.06em;
}
.modal-story h3::before{content:'✦ ';font-size:0.7em;opacity:0.6}
.modal-story p{
  font-size:clamp(0.85rem,1.1vw,0.95rem);
  line-height:1.8;
  color:rgba(220,215,240,0.82);
  margin-bottom:0.8rem;
}
.modal-story p:last-child{margin-bottom:0}

.modal-details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0.8rem;
}
.detail-item{
  padding:0.8rem 1rem;
  border-radius:12px;
  background:rgba(13,15,26,0.5);
  border:1px solid rgba(107,92,231,0.06);
}
.detail-label{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:rgba(200,190,240,0.35);
  margin-bottom:0.2rem;
}
.detail-value{
  font-size:0.9rem;
  color:rgba(220,215,240,0.85);
}
@media(max-width:600px){
  .modal-header{padding:1.5rem 1.2rem 1rem}
  .modal-body{padding:0 1.2rem 1.5rem}
  .modal-details{grid-template-columns:1fr}
  .modal-story{padding:1rem 1.2rem}
  .modal-overlay{padding:1rem}
  .modal-title-row{flex-direction:column;align-items:flex-start;gap:0.8rem}
}

/* ===== EMPTY STATE ===== */
.empty-state{
  grid-column:1/-1;
  text-align:center;
  padding:4rem 2rem;
  color:rgba(200,190,240,0.3);
}
.empty-state svg{width:48px;height:48px;opacity:0.2;margin-bottom:1rem}
.empty-state p{font-size:0.95rem;font-family:'Plus Jakarta Sans',sans-serif}

/* ===== FOOTER ===== */
footer{
  position:relative;z-index:10;
  text-align:center;
  padding:2rem;
  border-top:1px solid rgba(107,92,231,0.06);
  font-size:0.75rem;
  color:rgba(200,190,240,0.2);
  font-family:'Plus Jakarta Sans',sans-serif;
  letter-spacing:0.04em;
}
</style>
</head>
<body>

<!-- Starfield canvas -->
<canvas id="starfield"></canvas>

<!-- Header -->
<header>
  <div class="subtitle">Honkai: Star Rail · 星穹列车</div>
  <h1>✦ 角色群星录 ✦</h1>
  <p class="quote">愿此行，终抵群星</p>
</header>

<!-- Controls -->
<div class="controls">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" placeholder="搜索角色名…" autocomplete="off">
  </div>
  <div class="filter-group" id="filterGroup">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="star5">★5</button>
    <button class="filter-btn" data-filter="star4">★4</button>
    <button class="filter-btn" data-filter="path-毁灭">毁灭</button>
    <button class="filter-btn" data-filter="path-巡猎">巡猎</button>
    <button class="filter-btn" data-filter="path-智识">智识</button>
    <button class="filter-btn" data-filter="path-同谐">同谐</button>
    <button class="filter-btn" data-filter="path-虚无">虚无</button>
    <button class="filter-btn" data-filter="path-存护">存护</button>
    <button class="filter-btn" data-filter="path-丰饶">丰饶</button>
    <button class="filter-btn" data-filter="path-记忆">记忆</button>
    <button class="filter-btn" data-filter="path-欢愉">欢愉</button>
  </div>
</div>

<!-- Grid -->
<div class="grid-wrap">
  <div class="char-grid" id="charGrid"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<footer>崩坏：星穹铁道 · 星穹列车资料库 &nbsp;·&nbsp; 愿此行，终抵群星</footer>

<script>
// ===== STARFIELD =====
const canvas=document.getElementById('starfield');
const ctx=canvas.getContext('2d');
let stars=[];
function resizeCanvas(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);
for(let i=0;i<200;i++){
  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*1.5+0.3,
    a:Math.random(),
    da:(Math.random()-0.5)*0.008
  });
}
function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const s of stars){
    s.a+=s.da;
    if(s.a>1||s.a<0){s.da*=-1}
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(200,190,240,${s.a*0.6})`;
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
drawStars();

// ===== CHARACTER DATA =====
const characters = [
  {
    id:'trailblazer',name:'开拓者',alt:'星 / 穹',emoji:'🌌',
    rarity:5,path:'毁灭',element:'物理',
    story:'你是被星核猎手卡芙卡和银狼从黑暗中唤醒的容器——一颗星核被植入你的体内，使你成为了星核的载体。在空间站「黑塔」的意外中，你被三月七和丹恒发现，随后受到了姬子的邀请，登上了星穹列车，成为了「无名客」的一员。',
    story2:'你的旅途始于雅利洛-VI，在冰封的星球上见证了贝洛伯格与裂界之间的千年抗争。随后你抵达了仙舟「罗浮」，卷入了建木之祸与药王秘传的危机。每一次抉择，都让你更接近自己的身世之谜——你究竟是谁？星核为何在你体内？而答案，或许藏在那无尽的星穹深处……',
    elementClass:'physical'
  },
  {
    id:'march7',name:'三月七',alt:'March 7th',emoji:'📷',
    rarity:4,path:'存护',element:'冰',
    story:'三月七是一位从恒冰中苏醒的少女，失去了所有记忆，甚至对自己的名字也一无所知。「三月七」是她被唤醒的那一天——她为自己取了这个名字，作为新生命的起点。',
    story2:'她性格开朗活泼，热爱摄影，喜欢用相机记录下沿途的每一处风景。身为星穹列车的乘员之一，她把列车当成了自己的家，把同伴们当成了家人。虽然她总是笑脸迎人，但在无人知晓的深夜，那片封印着她的恒冰中隐藏的秘密，始终是她心中无法抹去的阴影。',
    elementClass:'ice'
  },
  {
    id:'danheng',name:'丹恒',alt:'Dan Heng',emoji:'🐉',
    rarity:4,path:'巡猎',element:'风',
    story:'丹恒是仙舟「罗浮」持明族的后裔，同时也是不朽星神「龙」的血脉传人。他的前世是持明龙尊「饮月君」，曾肩负守望建木的重任，是仙舟的英雄。然而，一场巨大的变故让前世的他犯下了不可饶恕的罪过，最终被判以「蜕生」之刑，转世为现在的丹恒。',
    story2:'为了逃离那个沉重的过去，他选择登上星穹列车，成为一名无名客。他性格清冷寡言，持有一柄名为「击云」的长枪，在列车上担任护卫之职。然而，列车真的能带他远离过去吗？当昔日因果再度降临，他将不得不再一次面对那个属于「饮月」的命运。',
    elementClass:'wind'
  },
  {
    id:'himeko',name:'姬子',alt:'Himeko',emoji:'☕',

// ===== RENDER GRID =====
const grid=document.getElementById('charGrid');
const search=document.getElementById('search');
const filterBtns=document.querySelectorAll('.filter-btn');

function renderChars(){
  const q=search.value.toLowerCase().trim();
  const activeFilter=document.querySelector('.filter-btn.active');
  const filter=activeFilter ? activeFilter.dataset.filter : 'all';

  const filtered=characters.filter(c=>{
    if(q && !c.name.includes(q) && !c.alt.toLowerCase().includes(q) && !c.path.includes(q)){
      return false;
    }
    if(filter==='star5' && c.rarity!==5) return false;
    if(filter==='star4' && c.rarity!==4) return false;
    if(filter.startsWith('path-') && c.path!==filter.replace('path-','')) return false;
    return true;
  });

  if(filtered.length===0){
    grid.innerHTML=`
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        <p>没有找到匹配的角色</p>
      </div>`;
    return;
  }

  grid.innerHTML=filtered.map(c=>{
    const rarityClass=c.rarity===5?'rarity-5':'rarity-4';
    const starIcons='★'.repeat(c.rarity);
    return `
      <div class="char-card" data-id="${c.id}" onclick="openModal('${c.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')openModal('${c.id}')">
        <div class="rarity ${rarityClass}"></div>
        <div class="avatar">
          <div class="avatar-inner">
            <img src="${imageMap[c.id]||''}" alt="${c.name}" class="char-img" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <span class="emoji-fallback" style="display:none">${c.emoji}</span>
          </div>
        </div>
        <div class="info">
          <div class="name">${c.name} <span class="star-icon">${starIcons}</span></div>
          <div class="tags">
            <span class="tag tag-${c.elementClass}">${c.element}</span>
            <span class="tag" style="background:rgba(107,92,231,0.15);color:#8b7cf7;opacity:0.7">${c.path}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

// ===== MODAL =====
const overlay=document.getElementById('modalOverlay');
const modalContent=document.getElementById('modalContent');

function openModal(id){
  const c=characters.find(ch=>ch.id===id);
  if(!c)return;
  const rarityClass=c.rarity===5?'gold':'purple';
  const rarityLabel=c.rarity===5?'★★★★★':'★★★★';
  modalContent.innerHTML=`
    <button class="modal-close" onclick="closeModal()" aria-label="关闭">✕</button>
    <div class="modal-header">
      <div class="modal-rarity ${rarityClass}">${rarityLabel}</div>
      <div class="modal-title-row">
        <div class="modal-portrait">
          <img src="${imageMap[c.id]||''}" alt="${c.name}" class="modal-img" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <span class="modal-emoji-fallback" style="display:none;font-size:3rem">${c.emoji}</span>
        </div>
        <div class="modal-title-info">
          <div class="modal-title">
            <h2>${c.name}</h2>
            <span class="alt-name">${c.alt}</span>
          </div>
          <div class="modal-meta">
            <span class="tag tag-${c.elementClass}">${c.element}</span>
            <span class="tag" style="background:rgba(107,92,231,0.15);color:#8b7cf7">${c.path}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-story">
        <h3>角色故事</h3>
        <p>${c.story}</p>
        ${c.story2 ? `<p>${c.story2}</p>` : ''}
      </div>
      <div class="modal-details">
        <div class="detail-item">
          <div class="detail-label">命途</div>
          <div class="detail-value">${c.path}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">属性</div>
          <div class="detail-value">${c.element}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">稀有度</div>
          <div class="detail-value">${'★'.repeat(c.rarity)}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">别称</div>
          <div class="detail-value">${c.alt}</div>
        </div>
      </div>
    </div>
  `;
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  overlay.classList.remove('open');
  document.body.style.overflow='';
}

overlay.addEventListener('click',(e)=>{
  if(e.target===overlay) closeModal();
});
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape') closeModal();
});

// ===== FILTER EVENTS =====
filterBtns.forEach(btn=>{
  btn.addEventListener('click',()=>{
    filterBtns.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderChars();
  });
});

search.addEventListener('input',renderChars);

// ===== INIT =====
renderChars();
</script>
